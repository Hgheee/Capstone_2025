spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        hbm2ddl.auto: create-drop
    show-sql: true
  h2:
    console:
      enabled: true

jwt:
  secret: test-secret-key-for-testing
  expiration: 900000
  secret-key: test-secret-key-for-testing
  access-token:
    expiration: 900000

logging:
  level:
    org.springframework.security: DEBUG
