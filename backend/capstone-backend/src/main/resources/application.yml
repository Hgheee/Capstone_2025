server:
  port: 8081

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:mysql://localhost:3306/capstone_db?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useUnicode=true&allowPublicKeyRetrieval=true
    username: hogeonhee
    password: 0316
    driver-class-name: com.mysql.cj.jdbc.Driver
    
    # 커넥션 풀 설정
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 1800000

  jpa:
    # 스키마 자동 업데이트 (개발 환경)
    hibernate:
      ddl-auto: update
    # SQL 로그 출력 (개발 환경)
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true
        # N+1 쿼리 감지
        generate_statistics: false
    open-in-view: false
  
  # SQL 초기화 설정
  sql:
    init:
      mode: always
      continue-on-error: true

api:
  seoul:
    key: ${SEOUL_API_KEY}

# 데이터 자동 수집 스케줄러 설정
scheduler:
  enabled: false  # true로 변경하면 자동 수집 활성화 (매일 오전 3시, 4시)
