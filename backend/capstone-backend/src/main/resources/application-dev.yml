# ================================
# 개발 환경 설정
# ================================

api:
  seoul:
    key: ${SEOUL_API_KEY}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

    # 커넥션 풀 최적화 (HikariCP)
    hikari:
      minimum-idle: ${DB_HIKARI_MINIMUM_IDLE:5}
      maximum-pool-size: ${DB_HIKARI_MAXIMUM_POOL_SIZE:20}
      connection-timeout: ${DB_HIKARI_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${DB_HIKARI_IDLE_TIMEOUT:300000}
      max-lifetime: ${DB_HIKARI_MAX_LIFETIME:1800000}

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: ${FORMAT_SQL:true}
        jdbc:
          batch_size: 100
          order_inserts: true
          order_updates: true
        generate_statistics: false
    open-in-view: false

  sql:
    init:
      mode: always
      continue-on-error: true

  web:
    resources:
      add-mappings: true

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:20MB}

server:
  port: ${SERVER_PORT:8081}
  error:
    include-exception: true
    include-message: always
    include-stacktrace: on_param

# 로깅
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.lostfound: ${LOG_LEVEL_COM_LOSTFOUND:DEBUG}
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
  file:
    name: ${LOG_FILE_PATH:./logs/application.log}
  logback:
    rollingpolicy:
      max-file-size: ${LOG_MAX_FILE_SIZE:10MB}
      max-history: ${LOG_MAX_HISTORY:30}

debug: ${ENABLE_DEBUG:false}

# Management/Actuator
management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_ENABLED:health,info,metrics}
  server:
    port: ${MANAGEMENT_SERVER_PORT:9081}
  endpoint:
    health:
      show-details: always

# LOST112 API 설정
lost112:
  api:
    base-url: ${LOST112_BASE_URL:https://apis.data.go.kr/1320000/LosfundInfoInqireService}
    api-key: ${LOST112_API_KEY}
  page:
    size: ${LOST112_PAGE_SIZE:100}
    sleep-ms: ${LOST112_PAGE_SLEEP_MS:500}
  timeouts:
    connect-ms: ${LOST112_CONNECT_TIMEOUT_MS:5000}
    read-ms: ${LOST112_READ_TIMEOUT_MS:30000}
  retry:
    max-attempts: ${LOST112_RETRY_MAX_ATTEMPTS:3}
    delay-ms: ${LOST112_RETRY_DELAY_MS:1000}

# JWT 토큰
jwt:
  secret-key: ${JWT_SECRET_KEY}
  access-token:
    expiration: ${JWT_EXPIRATION_TIME:900000}
  refresh-token:
    expiration: ${JWT_REFRESH_EXPIRATION_TIME:604800000}

# CORS
cors:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,PATCH,OPTIONS}
  allowed-headers: ${CORS_ALLOWED_HEADERS:Content-Type,Authorization,X-Requested-With}
  max-age: ${CORS_MAX_AGE:3600}

# 파일 업로드
file:
  upload:
    dir: ${UPLOAD_DIR:./uploads}
    allowed-extensions: ${ALLOWED_FILE_EXTENSIONS:jpg,jpeg,png,gif,webp}
    max-size: ${MAX_FILE_SIZE:10MB}
  image:
    max-width: ${MAX_IMAGE_WIDTH:1920}
    max-height: ${MAX_IMAGE_HEIGHT:1080}
    thumbnail:
      width: ${THUMBNAIL_WIDTH:300}
      height: ${THUMBNAIL_HEIGHT:200}

# 캐시
cache:
  type: ${CACHE_TYPE:simple}
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    timeout: ${REDIS_TIMEOUT:2000ms}
    database: ${REDIS_DATABASE:0}

# 검색
search:
  min-word-length: ${SEARCH_MIN_WORD_LENGTH:2}
  max-results: ${SEARCH_MAX_RESULTS:1000}
  highlight-enabled: ${SEARCH_HIGHLIGHT_ENABLED:true}
  similarity-threshold: ${MATCHING_SIMILARITY_THRESHOLD:0.7}

# 스케줄링
scheduling:
  lost112-import: ${LOST112_IMPORT_SCHEDULE:0 0 2 * * ?}
  token-cleanup: ${TOKEN_CLEANUP_SCHEDULE:0 0 3 * * ?}
  file-cleanup: ${TEMP_FILE_CLEANUP_SCHEDULE:0 30 3 * * ?}

# 알림
notification:
  email:
    enabled: ${EMAIL_NOTIFICATIONS_ENABLED:false}
    template-path: ${NOTIFICATION_EMAIL_TEMPLATE_PATH:./templates/email}
  batch:
    size: ${NOTIFICATION_BATCH_SIZE:100}
    interval-ms: ${NOTIFICATION_BATCH_INTERVAL_MS:30000}

# 외부 서비스
external:
  kakao:
    map-api-key: ${KAKAO_MAP_API_KEY:}
  sms:
    api-key: ${SMS_API_KEY:}
    sender-number: ${SMS_SENDER_NUMBER:}

# 보안
security:
  rate-limit:
    requests-per-minute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:100}
    burst-capacity: ${RATE_LIMIT_BURST_CAPACITY:200}
  headers:
    frame-options: ${SECURITY_FRAME_OPTIONS:DENY}
    content-type-options: ${SECURITY_CONTENT_TYPE_OPTIONS:nosniff}
    xss-protection: ${SECURITY_XSS_PROTECTION:1; mode=block}

# 개발 전용
development:
  performance-monitoring: ${ENABLE_PERFORMANCE_MONITORING:false}
  mock-data:
    generate: ${GENERATE_MOCK_DATA:false}
    count: ${MOCK_DATA_COUNT:100}
