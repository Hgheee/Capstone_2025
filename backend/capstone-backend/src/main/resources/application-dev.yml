api:
  seoul:
    key: ${SEOUL_API_KEY:sample-seoul-api-key}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

    # 커넥션 풀 최적화 (HikariCP)
    hikari:
      minimum-idle: ${DB_HIKARI_MINIMUM_IDLE:5}
      maximum-pool-size: ${DB_HIKARI_MAXIMUM_POOL_SIZE:20}
      connection-timeout: ${DB_HIKARI_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${DB_HIKARI_IDLE_TIMEOUT:300000}
      max-lifetime: ${DB_HIKARI_MAX_LIFETIME:1800000}

  jpa:
    # 🔥 핵심 설정: DB 초기화 문제 해결
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: none   # 개발 중엔 create-drop → update 로 변경 추천
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: ${FORMAT_SQL:true}
        # 성능 최적화
        jdbc:
          batch_size: 100
          order_inserts: true
          order_updates: true
        # N+1 쿼리 문제 감지
        generate_statistics: false
    open-in-view: false  # 성능 최적화 & Lazy 로딩 문제 방지

  sql:
    init:
      mode: always
      continue-on-error: true  # 초기화 스크립트 오류 시에도 계속 진행

  # Week 4 확장: 웹 설정
  web:
    resources:
      add-mappings: true

  # Week 4 확장: 파일 업로드
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:20MB}

server:
  port: ${SERVER_PORT:8081}
  # Week 4: 에러 페이지 설정
  error:
    include-exception: true
    include-message: always
    include-stacktrace: on_param

# 로깅 레벨 - Week 4 확장
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.lostfound: ${LOG_LEVEL_COM_LOSTFOUND:DEBUG}
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
  file:
    name: ${LOG_FILE_PATH:./logs/application.log}
  logback:
    rollingpolicy:
      max-file-size: ${LOG_MAX_FILE_SIZE:10MB}
      max-history: ${LOG_MAX_HISTORY:30}

# 디버그 모드 (애플리케이션 전체 상세 로그 필요할 때만 true)
debug: ${ENABLE_DEBUG:false}

# Management/Actuator - Week 4 모니터링
management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_ENABLED:health,info,metrics}
  # 메인 포트(8081)에서 Actuator 사용
  # server:
  #   port: ${MANAGEMENT_SERVER_PORT:9081}
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: false  # Redis 사용하지 않으므로 health check 비활성화

# LOST112 API 설정
lost112:
  base-url: ${LOST112_BASE_URL}
  api-key: ${LOST112_API_KEY}
  timeouts:
    connect-ms: ${LOST112_CONNECT_TIMEOUT_MS:2000}
    read-ms: ${LOST112_READ_TIMEOUT_MS:8000}
  page:
    size: ${LOST112_PAGE_SIZE:50}
    sleep-ms: ${LOST112_PAGE_SLEEP_MS:300}
  # Week 4 확장: 재시도 로직
  retry:
    max-attempts: ${LOST112_MAX_RETRY_COUNT:3}
    delay-ms: ${LOST112_RETRY_DELAY_MS:1000}
  python:
    enabled: ${LOST112_PYTHON_ENABLED:true}
    executable: ${PYTHON_EXECUTABLE:python}
    # 🔥 절대 경로로 수정!
    script-path: ${LOST112_PYTHON_SCRIPT_PATH:C:/Users/User/Desktop/Capstone_2025/data/lost112_collect_and_sync_fast.py}
    work-dir: ${LOST112_PYTHON_WORK_DIR:C:/Users/User/Desktop/Capstone_2025/data}
    env-file: ${LOST112_PYTHON_ENV_FILE:C:/Users/User/Desktop/Capstone_2025/data/.env}
    # output-dir 주석 처리 (Python 스크립트가 지원하지 않음)
    # output-dir: ${LOST112_PYTHON_OUTPUT_DIR:../../data/out}
    default-rows: ${LOST112_PYTHON_DEFAULT_ROWS:100}
    default-max-pages: ${LOST112_PYTHON_DEFAULT_MAX_PAGES:20}
    default-day-range: ${LOST112_PYTHON_DEFAULT_DAY_RANGE:7}
    sleep-sec: ${LOST112_PYTHON_SLEEP_SEC:0.3}
    default-concurrency: ${LOST112_PYTHON_DEFAULT_CONCURRENCY:2}
    timeout-sec: ${LOST112_PYTHON_TIMEOUT_SEC:120}
    max-output-chars: ${LOST112_PYTHON_MAX_OUTPUT_CHARS:200000}

# Week 4 확장: JWT 토큰 설정
jwt:
  secret-key: ${JWT_SECRET_KEY:default-dev-jwt-secret-key-please-change-immediately-1234567890}
  access-token:
    expiration: ${JWT_EXPIRATION_TIME:900000}
  refresh-token:
    expiration: ${JWT_REFRESH_EXPIRATION_TIME:604800000}

# Week 4 확장: CORS 설정
cors:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,PATCH,OPTIONS}
  allowed-headers: ${CORS_ALLOWED_HEADERS:Content-Type,Authorization,X-Requested-With}
  max-age: ${CORS_MAX_AGE:3600}

# Week 4 확장: 파일 업로드 설정
file:
  upload:
    dir: ${UPLOAD_DIR:./uploads}
    allowed-extensions: ${ALLOWED_FILE_EXTENSIONS:jpg,jpeg,png,gif,webp}
    max-size: ${MAX_FILE_SIZE:10MB}
  image:
    max-width: ${MAX_IMAGE_WIDTH:1920}
    max-height: ${MAX_IMAGE_HEIGHT:1080}
    thumbnail:
      width: ${THUMBNAIL_WIDTH:300}
      height: ${THUMBNAIL_HEIGHT:200}

# Week 4 확장: 캐시 설정
cache:
  type: ${CACHE_TYPE:simple}
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    timeout: ${REDIS_TIMEOUT:2000ms}
    database: ${REDIS_DATABASE:0}

# Week 4 확장: 검색 엔진 설정
search:
  min-word-length: ${SEARCH_MIN_WORD_LENGTH:2}
  max-results: ${SEARCH_MAX_RESULTS:1000}
  highlight-enabled: ${SEARCH_HIGHLIGHT_ENABLED:true}
  similarity-threshold: ${MATCHING_SIMILARITY_THRESHOLD:0.7}

# Week 4 확장: 스케줄링 설정
scheduling:
  lost112-import: ${LOST112_IMPORT_SCHEDULE:0 0 2 * * ?}
  token-cleanup: ${TOKEN_CLEANUP_SCHEDULE:0 0 3 * * ?}
  file-cleanup: ${TEMP_FILE_CLEANUP_SCHEDULE:0 30 3 * * ?}

# Week 4 확장: 알림 설정
notification:
  email:
    enabled: ${EMAIL_NOTIFICATIONS_ENABLED:true}
    template-path: ${NOTIFICATION_EMAIL_TEMPLATE_PATH:./templates/email}
  batch:
    size: ${NOTIFICATION_BATCH_SIZE:100}
    interval-ms: ${NOTIFICATION_BATCH_INTERVAL_MS:30000}

# Week 4 확장: 외부 서비스 설정
external:
  kakao:
    map-api-key: ${KAKAO_MAP_API_KEY:}
  sms:
    api-key: ${SMS_API_KEY:}
    sender-number: ${SMS_SENDER_NUMBER:}

# Week 4 확장: 보안 강화
security:
  rate-limit:
    requests-per-minute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:100}
    burst-capacity: ${RATE_LIMIT_BURST_CAPACITY:200}
  headers:
    frame-options: ${SECURITY_FRAME_OPTIONS:DENY}
    content-type-options: ${SECURITY_CONTENT_TYPE_OPTIONS:nosniff}
    xss-protection: ${SECURITY_XSS_PROTECTION:1; mode=block}

# 개발 및 디버깅
development:
  performance-monitoring: ${ENABLE_PERFORMANCE_MONITORING:false}
  mock-data:
    generate: ${GENERATE_MOCK_DATA:false}
    count: ${MOCK_DATA_COUNT:100}
